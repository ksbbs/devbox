server:
  port: 8080
  auth_token: ""
  public_url: ""                # 公网访问地址，如 https://dev.example.com

mirrors:
  npm:
    enabled: true
    upstream: "https://registry.npmjs.org"
    cache_ttl: "7d"
  pypi:
    enabled: true
    upstream: "https://pypi.org/simple"
    cache_ttl: "30d"
  docker:
    enabled: true
    upstream: "https://registry-1.docker.io"
    cache_ttl: "0"
  golang:
    enabled: true
    upstream: "https://proxy.golang.org"
    cache_ttl: "0"
  cran:
    enabled: true
    upstream: "https://cran.r-project.org"
    cache_ttl: "30d"
  ghcr:
    enabled: true
    upstream: "https://ghcr.io"
    cache_ttl: "0"
  quay:
    enabled: true
    upstream: "https://quay.io"
    cache_ttl: "0"
  mcr:
    enabled: true
    upstream: "https://mcr.microsoft.com"
    cache_ttl: "0"
  ghapi:
    enabled: true
    upstream: "https://api.github.com"
    cache_ttl: "0"
  hf:
    enabled: true
    upstream: "https://huggingface.co"
    cache_ttl: "0"
  conda:
    enabled: true
    upstream: "https://repo.anaconda.com"
    cache_ttl: "30d"
  rubygems:
    enabled: true
    upstream: "https://rubygems.org"
    cache_ttl: "7d"
  cargo:
    enabled: true
    upstream: "https://static.crates.io/crates"
    cache_ttl: "7d"
  nuget:
    enabled: true
    upstream: "https://api.nuget.org/v3"
    cache_ttl: "7d"
  apt:
    enabled: true
    upstream: "https://deb.debian.org/debian"
    cache_ttl: "0"
  alpine:
    enabled: true
    upstream: "https://dl-cdn.alpinelinux.org/alpine"
    cache_ttl: "0"
  homebrew:
    enabled: true
    upstream: "https://ghcr.io/v2/homebrew/core"
    cache_ttl: "0"

gitproxy:
  enabled: true
  github_upstream: "https://github.com"
  gitlab_upstream: "https://gitlab.com"
  cache_ttl: "7d"

cache:
  dir: "/data/cache"
  max_size: "5GB"

logging:
  level: "info"
  access_log: true
  retention_days: 30              # 流量日志保留天数，过期自动清除

rate_limit:
  enabled: false                  # 启用 IP 限流
  rate: 500                       # 每个 IP 在滚动时间窗口内最大请求数
  interval: "3h"                  # 滚动时间窗口长度
  whitelist: []                   # 白名单 IP/CIDR（免限速）
  blacklist: []                   # 黑名单 IP/CIDR（永远禁止）
  trusted_proxies: ["127.0.0.1/8", "::1/128"]   # 信任转发头(如 X-Real-IP)的代理网段，反代场景按需加 docker 网桥等
